
[Unit]
# Do not start the legacy Bluetooth Manager (btmgr) when the RDK Bluetooth SDK
# (PipeWire BT audio stack) is present. The bluetoothsdk recipe installs
# librdk_bluetooth.so under <libdir>/bluetoothsdk/. When that library exists
# this condition fails and btmgr is cleanly skipped at boot (not marked failed);
# on legacy builds without the SDK the library is absent and btmgr starts as usual.
#
# TEMPORARILY DISABLED: the middleware bluetooth-sdk stub now always installs
# this path, so the condition would suppress btmgr on every build. Needs a gate
# that distinguishes the real vendor SDK from the stub.
#ConditionPathExistsGlob=!/usr/lib*/bluetoothsdk/librdk_bluetooth.so
